# Coolify: Base Directory vacío, Compose = docker-compose.yml
# Build-arg API_URL = URL pública del backend
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-https://app.mtasoftware.cloud}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
